<style>
:root{--bg:#0E0B1E;--surf:#17132B;--line:#2a2447;--p:#8B5CF6;--pl:#C4B5FD;--tx:#F3F0FF;--mut:#a39cc4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;color:var(--tx);font:400 1rem/1.6 "Space Grotesk",system-ui,sans-serif;background-color:var(--bg);overflow-x:hidden}
.rule{border:0;height:1px;margin:0;background:linear-gradient(90deg,var(--p),rgba(139,92,246,0) 70%)}
.band{height:56px;margin:0 -4% 40px;transform:rotate(-2deg);background:repeating-conic-gradient(var(--p) 0 25%,#1c1540 0 50%) 0 0/28px 28px;opacity:.6;border-block:1px solid var(--pl)}
.hi{display:block;margin-bottom:10px;font:500 1rem "JetBrains Mono",monospace;letter-spacing:0;color:var(--mut)}
.logo{font-family:Outfit,sans-serif}
.links,.mi small,.tile{font-family:"JetBrains Mono",monospace;font-size:.82rem}
.bg{position:absolute;right:-12%;top:6%;width:55vw;max-width:700px;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(139,92,246,.26),transparent 65%);pointer-events:none;z-index:-1;animation:pulse 6s ease-in-out infinite}
.root{position:relative;overflow:clip}
.root::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background-image:linear-gradient(rgba(139,92,246,.1) 2px,transparent 2px),linear-gradient(90deg,rgba(139,92,246,.1) 2px,transparent 2px);background-size:48px 48px}
.flow{position:fixed;left:0;top:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.deco{position:absolute;pointer-events:none;color:var(--pl);opacity:.5;filter:drop-shadow(0 0 10px rgba(139,92,246,.7));animation:float var(--t,7s) ease-in-out infinite;animation-delay:var(--dl,0s)}
.deco svg{display:block;width:100%;height:100%;fill:rgba(139,92,246,.1);stroke:currentColor;stroke-width:1.600;stroke-linejoin:round;stroke-linecap:round}
.deco circle{fill:currentColor;stroke:none}
@keyframes float{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-16px) rotate(calc(var(--r,0deg) + 8deg))}}
.ic{display:grid;width:32px;height:32px;flex:none}.ic svg{width:100%;height:100%}
.wrap{max-width:1800px;margin:0 auto;padding:0 clamp(20px,6vw,120px)}
nav{display:flex;align-items:center;justify-content:space-between;padding:20px 0}
.logo{display:flex;align-items:center;gap:12px;font-weight:700;font-size:1.15rem}
.logo i{width:40px;height:40px;border-radius:50%;background:var(--p);display:grid;place-items:center;font-style:normal}
.links{display:flex;gap:28px;color:var(--mut)}
.links span{opacity:.55;cursor:not-allowed}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;min-height:calc(100svh - 170px);padding:24px 0 56px}
h1{margin:0;font:800 clamp(2.4rem,calc(min(100vw,1800px)*.7/var(--L,8)),7.6rem)/1 Outfit,sans-serif;letter-spacing:-.035em}
h1 b{display:block;color:var(--pl)}
.role{margin:14px 0 0;font-size:1.25rem;font-weight:500}
.bio{max-width:46ch;color:var(--mut);margin:12px 0 0}
.draft{font:500 .7rem "JetBrains Mono",monospace;color:var(--pl);border:1px solid var(--line);border-radius:99px;padding:1px 8px;margin-left:8px;white-space:nowrap}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-top:26px}
.btn{display:inline-block;padding:12px 26px;border-radius:99px;background:var(--p);color:#fff;font-weight:500;text-decoration:none;box-shadow:0 8px 28px rgba(139,92,246,.35);transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 34px rgba(139,92,246,.5)}
.btn[aria-disabled=true]{background:var(--surf);color:var(--mut);box-shadow:none;border:1px dashed var(--line);cursor:not-allowed;transform:none}
.soc{display:flex;gap:10px}
.soc a{display:grid;place-items:center;width:44px;height:44px;border:1px solid var(--line);border-radius:12px;color:var(--tx);text-decoration:none;background:var(--surf);transition:border-color .2s}
.soc a:hover{border-color:var(--p)}
.tech{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
.tile{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 6px;background:var(--surf);border:1px solid var(--line);border-radius:12px;font-size:.9rem;transition:transform .2s,border-color .2s}
.tile:hover{transform:translateY(-3px);border-color:var(--p)}
.music{display:flex;align-items:center;gap:14px;margin-top:22px;max-width:380px;padding:12px;background:var(--surf);border:1px solid var(--line);border-radius:16px}
.art{width:54px;height:54px;border-radius:10px;background:linear-gradient(135deg,var(--p),#3b2a7a);display:grid;place-items:center;font-size:1.4rem;flex:none}
.mi{flex:1;min-width:0}
.mi strong,.mi small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi small{color:var(--mut)}
.bar{height:4px;border-radius:4px;background:var(--line);margin-top:8px;overflow:hidden}
.bar span{display:block;width:35%;height:100%;background:var(--p)}
.play{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:var(--p);color:#fff;display:grid;place-items:center;text-decoration:none;cursor:pointer;font-size:1rem}
.play[aria-disabled=true]{background:var(--line);color:var(--mut);cursor:not-allowed}
.vis{display:grid;place-items:center}
.stage{position:relative;width:min(100%,680px);aspect-ratio:1}
.glow{position:absolute;inset:12%;border-radius:50%;background:var(--p);filter:blur(60px);opacity:.35;animation:pulse 4s ease-in-out infinite}
.ring{position:absolute;inset:0;border-radius:50%;border:2px dashed rgba(196,181,253,.55);animation:spin 40s linear infinite}
.ring2{position:absolute;inset:7%;border-radius:50%;border:1px solid var(--p)}
.photo{position:absolute;inset:13%;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 35% 30%,#a78bfa,#5b34c9 70%);display:grid;place-items:center;font-size:7rem;font-weight:700;box-shadow:0 0 0 6px var(--bg)}
.photo img{width:100%;height:100%;object-fit:cover}
.in{animation:rise .8s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--d,0s)}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{opacity:.6;transform:scale(1.06)}}
html{scroll-behavior:smooth}
.links a{color:inherit;text-decoration:none;transition:color .2s}.links a:hover{color:var(--pl)}
.about{display:grid;grid-template-columns:.8fr 1.2fr;gap:40px;padding:56px 0 80px;border-top:1px solid var(--line)}
.about h2{margin:0;font:800 clamp(2rem,4vw,3rem)/1.05 Outfit,sans-serif;letter-spacing:-.03em}
.about p{margin:0 0 28px;color:var(--mut);max-width:56ch;font-size:1.05rem}
.facts{margin:0;padding-left:20px;border-left:2px solid var(--p);display:grid;gap:14px}
.facts div{display:grid;grid-template-columns:110px 1fr;gap:12px}
.facts dt{font:500 .8rem "JetBrains Mono",monospace;color:var(--pl);padding-top:3px}
.facts dd{margin:0}
.rv{opacity:0;transform:translateY(24px);transition:opacity .8s,transform .8s cubic-bezier(.2,.7,.2,1)}
.rv.show{opacity:1;transform:none}
.pj{padding:56px 0 90px;border-top:1px solid var(--line)}
.pj h2{margin:0 0 28px;font:800 clamp(2rem,4vw,3rem)/1.05 Outfit,sans-serif;letter-spacing:-.03em}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.card{display:flex;flex-direction:column;gap:10px;padding:22px;background:var(--surf);border:1px solid var(--line);border-radius:16px;transition:transform .25s,border-color .25s}
.card:hover{transform:translateY(-4px);border-color:var(--p)}
.card h3{margin:0;font:700 1.3rem Outfit,sans-serif}
.card p{margin:0;color:var(--mut)}
.card .role2{color:var(--tx)}
.role2 span{display:block;font:500 .75rem "JetBrains Mono",monospace;color:var(--pl);margin-bottom:2px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.tags span{font:500 .75rem "JetBrains Mono",monospace;padding:2px 9px;border:1px solid var(--line);border-radius:99px;color:var(--pl)}
.card a{color:var(--pl);text-decoration:none;font-weight:500}.card a:hover{text-decoration:underline}
.cards.solo{grid-template-columns:1fr}.cards.solo .card{max-width:720px}
.role2.unset{color:var(--mut);font-style:italic}
.plinks{display:flex;gap:18px;flex-wrap:wrap}
.card.empty{border-style:dashed;min-height:150px;justify-content:center}
.card.empty:hover{transform:none;border-color:var(--line)}
.meta{font:500 .75rem "JetBrains Mono",monospace;color:var(--mut)}
.facts a{color:var(--pl);text-decoration:none}.facts a:hover{text-decoration:underline}
.unset2{color:var(--mut);font-style:italic}
.foot{padding:24px 0 36px;border-top:1px solid var(--line);color:var(--mut);font:500 .8rem "JetBrains Mono",monospace}
.pj,.about{position:relative}
.stage{transition:transform .25s ease-out;will-change:transform}
.card{animation:drift 7s ease-in-out infinite}
.card:nth-child(2){animation-delay:-2.300s}.card:nth-child(3){animation-delay:-4.600s}
@keyframes drift{50%{translate:0 -8px}}
.hob{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}
.hobcard{padding:0;gap:0}
.hobcard strong{font:700 1.15rem Outfit,sans-serif}
.hi2{display:block;width:46px;height:46px;color:var(--pl)}
.hi2 svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.600;stroke-linecap:round;stroke-linejoin:round}
.about{grid-template-columns:.7fr 1.3fr;gap:clamp(24px,4vw,64px);margin:56px 0 24px;padding:clamp(28px,4vw,56px);border:1px solid var(--line);border-radius:28px;background:linear-gradient(135deg,rgba(139,92,246,.16),rgba(23,19,43,.88) 55%);box-shadow:0 24px 80px rgba(139,92,246,.12)}
.about h2{font-size:clamp(2.6rem,5vw,4.6rem)}
.about h2::after{content:"";display:block;width:64px;height:4px;border-radius:4px;background:var(--p);margin-top:18px}
.about p:first-of-type{font:600 clamp(1.4rem,2.4vw,2.1rem)/1.3 Outfit,sans-serif;color:var(--tx);max-width:none;letter-spacing:-.01em}
.about .facts{grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;padding-left:0;border-left:0}
.about .facts div{display:block;padding:16px;border:1px solid var(--line);border-top:2px solid var(--p);border-radius:12px;background:rgba(14,11,30,.55)}
.about .facts dt{margin-bottom:6px}
.soc svg{width:20px;height:20px;fill:currentColor}.soc a:hover{color:var(--pl)}
.facts dt svg{width:16px;height:16px;fill:currentColor;vertical-align:-3px;margin-right:8px}
.foot{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:center}
.fnav{display:flex;flex-wrap:wrap;gap:6px 20px}.fnav a{color:inherit;text-decoration:none}.fnav a:hover{color:var(--pl)}
h1 b .word{display:inline-block;white-space:nowrap}
h1 b .word span{display:inline-block;animation:letter .8s cubic-bezier(.2,.7,.2,1) both,wave 3.6s ease-in-out infinite;animation-delay:calc(.4s + var(--i)*.1s),calc(1.6s + var(--i)*.18s)}
h1 b{animation:txtglow 4s ease-in-out infinite}
.band{animation:slide 2.4s linear infinite}
@keyframes letter{from{opacity:0;transform:translateY(.5em) rotate(6deg)}to{opacity:1;transform:none}}
@keyframes wave{0%,100%{transform:translateY(0)}50%{transform:translateY(-.08em)}}
@keyframes txtglow{0%,100%{text-shadow:0 0 18px rgba(139,92,246,.35)}50%{text-shadow:0 0 38px rgba(139,92,246,.75)}}
@keyframes slide{to{background-position:28px 0}}
.hobimg{position:relative;aspect-ratio:16/10;display:grid;place-items:center;background:linear-gradient(135deg,rgba(139,92,246,.3),rgba(23,19,43,.9))}
.hobimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s}
.hobcard:hover img{transform:scale(1.06)}
.hobcard strong{display:block;padding:14px 18px 18px}
.card{position:relative;overflow:hidden}
.card::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(196,181,253,.14),transparent);transform:skewX(-20deg);pointer-events:none;animation:sweep 6s ease-in-out infinite}
.card:nth-child(2)::after{animation-delay:1.8s}.card:nth-child(3)::after{animation-delay:3.6s}
@keyframes sweep{0%,55%{left:-60%}100%{left:130%}}
.rv .tags span{opacity:0;transform:translateY(8px)}
.rv.show .tags span{opacity:1;transform:none;transition:opacity .5s,transform .5s;transition-delay:calc(.3s + var(--j,0)*.08s)}
.pj h2::after{content:"";display:block;height:3px;width:0;background:var(--p);border-radius:3px;margin-top:12px;transition:width .9s .3s cubic-bezier(.2,.7,.2,1)}
.rv.show .pj h2::after,.pj.rv.show h2::after{width:56px}
.rv .facts>div{opacity:0;transform:translateY(14px)}
.rv.show .facts>div{opacity:1;transform:none;transition:opacity .6s,transform .6s}
.facts>div:nth-child(2){transition-delay:.15s}.facts>div:nth-child(3){transition-delay:.3s}.facts>div:nth-child(4){transition-delay:.45s}
.bar.seek{height:6px;cursor:pointer}.bar span{transition:width .25s linear}
.mi .time{font:500 .7rem "JetBrains Mono",monospace;margin-top:4px}
.music.playing .art{animation:artpulse 1.8s ease-in-out infinite}
@keyframes artpulse{50%{box-shadow:0 0 0 8px rgba(139,92,246,.28)}}
.cnav,.cinfo{display:flex;flex-direction:column;gap:14px}
.clabel{margin:0 0 6px;font:500 .8rem "JetBrains Mono",monospace;color:var(--pl)}
.cnav a{font:700 clamp(1.15rem,2vw,1.5rem)/1.2 Outfit,sans-serif;color:var(--tx);text-decoration:none;transition:color .2s,transform .2s}
.cnav a:hover{color:var(--pl);transform:translateX(6px)}
.cinfo h2{margin:0 0 6px;font:800 clamp(1.6rem,3vw,2.3rem)/1.05 Outfit,sans-serif;letter-spacing:-.03em}
.cfoot{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:center;padding-top:20px;border-top:1px solid var(--line);color:var(--mut);font:500 .8rem "JetBrains Mono",monospace}
.cfoot a{color:inherit;text-decoration:none}.cfoot a:hover{color:var(--pl)}
.sfoot{width:100%;margin-top:56px;padding:48px 0;border-top:1px solid rgba(196,181,253,.3);background:linear-gradient(180deg,rgba(139,92,246,.07),rgba(14,11,30,.6))}
.sfcols{display:flex;justify-content:space-between;gap:40px 80px;flex-wrap:wrap}
.cinfo{min-width:min(100%,380px)}
.sfoot .cfoot{margin-top:40px}
.ftop{display:flex;justify-content:space-between;align-items:center;gap:28px 40px;flex-wrap:wrap}
.fcta h2{margin:0 0 14px;font:800 clamp(1.5rem,3vw,2.3rem)/1.15 Outfit,sans-serif;letter-spacing:-.02em;max-width:22ch}
.fnav2{display:flex;flex-wrap:wrap;gap:6px 22px;font:500 .85rem "JetBrains Mono",monospace}
.fnav2 a{color:var(--mut);text-decoration:none;transition:color .2s}.fnav2 a:hover{color:var(--pl)}
.pills{display:flex;flex-wrap:wrap;gap:12px}
.pill{display:inline-flex;align-items:center;gap:10px;padding:10px 18px;border:1px solid var(--line);border-radius:99px;background:rgba(23,19,43,.7);color:var(--tx);text-decoration:none;font-weight:500;transition:border-color .25s,box-shadow .25s,transform .25s,color .25s}
.pill:hover{border-color:rgba(196,181,253,.7);color:var(--pl);box-shadow:0 0 0 1px rgba(196,181,253,.25),0 0 22px rgba(139,92,246,.45);transform:translateY(-2px)}
.pill.off{border-style:dashed;color:var(--mut);font-style:italic}.pill.off:hover{box-shadow:none;transform:none;border-color:var(--line);color:var(--mut)}
.pi{display:inline-grid;width:18px;height:18px}.pi svg{width:100%;height:100%;fill:currentColor}
.fdiv{border:0;height:1px;margin:36px 0 22px;background:linear-gradient(90deg,transparent,rgba(196,181,253,.35),transparent)}
.fbot{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;font:500 .8rem "JetBrains Mono",monospace;color:var(--mut)}
.fbot .fl{justify-self:start}.fbot .fr{justify-self:end;text-align:right}
.badge{display:inline-flex;align-items:center;gap:10px;color:var(--tx)}
.dot{width:9px;height:9px;border-radius:50%;background:#4ade80;animation:ping 2s ease-out infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(74,222,128,.55)}70%,100%{box-shadow:0 0 0 9px rgba(74,222,128,0)}}
.fm{display:flex;align-items:center;gap:8px;justify-content:center}.loc{display:inline-flex;align-items:center;gap:6px}
html[data-motion=reduced]{scroll-behavior:auto}
html[data-motion=reduced] *,html[data-motion=reduced] *::before,html[data-motion=reduced] *::after{animation:none!important;transition:none!important}
.fr{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.mtog{display:inline-flex;align-items:center;gap:10px;padding:6px 12px;border:1px solid var(--line);border-radius:99px;background:rgba(23,19,43,.7);color:var(--mut);font:500 .75rem "JetBrains Mono",monospace;cursor:pointer;transition:border-color .2s,color .2s}
.mtog:hover:not(:disabled){border-color:rgba(196,181,253,.6);color:var(--pl)}
.mtog:disabled{cursor:default;opacity:.85}
